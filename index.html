<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alignment IFC Planvy</title>
    <link rel="stylesheet" href="./src/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.149.0/build/three.module.js",
          "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.149.0/examples/jsm/controls/OrbitControls.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="shell">
      <header class="toolbar">
        <h1>Alignment IFC</h1>
        <div class="toolbar-right">
          <div class="classification-controls" aria-label="Riskklassificering">
            <label for="classification-risk-type">Risktyp</label>
            <select id="classification-risk-type">
              <option value="bom sprutbetong">bom sprutbetong</option>
              <option value="bomt bergparti">bomt bergparti</option>
            </select>

            <label for="classification-class">Riskniva</label>
            <select id="classification-class">
              <option value="TK1">TK1</option>
              <option value="TK2">TK2</option>
              <option value="TK3">TK3</option>
            </select>
          </div>

          <div class="actions">
            <button id="prev-step" type="button">Bak 5 m</button>
            <button id="view-3d" type="button">3D-flik</button>
            <button id="view-2d" type="button">2D-flik</button>
            <button id="next-step" type="button">Fram 5 m</button>
            <button id="save-ifc" type="button">Spara till IFC</button>
          </div>
        </div>
      </header>

      <main>
        <div id="viewer"></div>
      </main>

      <footer class="status" id="status">Laddar alignment.ifc...</footer>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
